# 1. Host Virtual: portal.empresa.local (Servido directamente por Nginx)
server {
    listen 80;                          # Escucha en el puerto 80 del contenedor (el que publicamos en el compose)
    server_name portal.empresa.local;   # Este bloque se usa cuando el Host de la petición es este nombre


    # Hardening perimetral básico (OWASP Top 10)
    # Son cabeceras de seguridad para proteger al navegador del cliente
    server_tokens off;    # Oculta la versión de nginx en las cabeceras y en las páginas de error
    # Evita que otra web meta la nuestra en un iframe 
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Obliga al navegador a respetar el tipo de contenido que le decimos
    add_header X-Content-Type-Options "nosniff" always;
    # Activa el filtro XSS del navegador 
    add_header X-XSS-Protection "1; mode=block" always;

    root /usr/share/nginx/html;         # Carpeta de donde saca los ficheros (la que montamos como volumen en el compose)
    index index.html;                   # Fichero que se sirve por defecto al pedir una carpeta

    location / {
        # Intenta servir el fichero pedido; si no existe prueba como carpeta;
        # y si tampoco, devuelve un error 404
        try_files $uri $uri/ =404;
    }

    # Segregación de logs por Host Virtual
    # Cada web tiene sus propios ficheros de log, así es más fácil revisar cada una por separado
    access_log /var/log/nginx/portal_access.log;        # Registro de las peticiones recibidas
    error_log  /var/log/nginx/portal_error.log warn;    # Registro de errores (desde nivel warn hacia arriba)
}

# 2. Host Virtual: app-gestion.empresa.local (Proxy Inverso hacia Apache)

server {
    listen 80;                                  # Mismo puerto, pero se distingue del otro bloque por el server_name
    server_name app-gestion.empresa.local;      # Peticiones con este Host entran por aquí

    server_tokens off;                          # Igual que antes: no enseñamos la versión de nginx

    # Aplicar cabeceras de hardening también en el proxy
    # (hay que repetirlas porque cada server es independiente y no hereda del otro)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        # Reenvía la petición al contenedor de apache. Usamos el nombre del servicio
        # del docker-compose (apache-app) porque Docker lo resuelve por DNS dentro de la red red-corp
        proxy_pass http://apache-app:80;

        # Cabeceras que le pasamos a apache, porque si no solo vería la IP de nginx:
        proxy_set_header Host $host;                                    # Mantiene el Host original (así apache elige bien su vhost)
        proxy_set_header X-Real-IP $remote_addr;                        # IP real del cliente que ha hecho la petición
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;    # Lista de IPs por las que ha pasado la petición (cliente + proxies)
        proxy_set_header X-Forwarded-Proto $scheme;                     # Protocolo original (http o https)

        # Tiempos máximos de espera, para que el proxy no se quede colgado si apache no responde
        proxy_connect_timeout 30s;      # Tiempo máximo para conectar con apache
        proxy_read_timeout 60s;         # Tiempo máximo esperando la respuesta de apache
        proxy_send_timeout 60s;         # Tiempo máximo enviando la petición a apache
    }

    # Logs propios de este host virtual (se guardan en ./nginx/logs del host por el volumen)
    access_log /var/log/nginx/app_gestion_access.log;
    error_log  /var/log/nginx/app_gestion_error.log warn;
}